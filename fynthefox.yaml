                  refresh_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjIyM2RlZGIyLWU5NDQtNDkyZi1hZGI0LWQ2NmNkYjk0M2E1MiIsImlhdCI6MTc1OTIxMDcyMCwiZXhwIjoxNzU5MjExOTIwfQ.G_rFRxmIrNCNpiWChrQgpVO6z50FfTB80wB0CCJZUPw;
                  Path=/api/auth/refresh-token; HttpOnly; Secure
            Content-Type:
              schema:
                type: string
                example: application/json; charset=utf-8
            ETag:
              schema:
                type: string
                example: W/"284-bn/BM51oHUy39TMUg/QkpxN36ho"
            Content-Length:
              schema:
                type: integer
                example: '409'
            Content-Encoding:
              schema:
                type: string
                example: br
            Vary:
              schema:
                type: string
                example: Accept-Encoding,User-Agent
            Date:
