openapi: 3.0.0
info:
  title: fynthefox
  version: 1.0.0
servers:
  - url: https://fynthefox.com.genriseyouthcenter.com/api
components:
  securitySchemes:
    noauthAuth:
      type: http
      scheme: noauth
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: admin
  - name: property-owners
  - name: users
  - name: users > register
  - name: users > fetch-all
  - name: users > delete
  - name: users > update
  - name: users > fetch-by-id
  - name: properties
  - name: agents
  - name: complaints
  - name: complaints > agent
  - name: account
  - name: dashboard
paths:
  /auth/login:
    post:
      tags:
        - auth
      summary: login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: Admin01@gmail.com
                password: Pass@1234
      security:
        - noauthAuth: []
      responses:
        '200':
          description: OK
          headers:
            Connection:
              schema:
                type: string
                example: Keep-Alive
            Keep-Alive:
              schema:
                type: string
                example: timeout=5, max=100
            X-Powered-By:
              schema:
                type: string
                example: Express
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '*'
